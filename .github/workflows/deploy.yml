name: Deploy to Oracle Cloud

on:
  push:
    branches: [ main, production, refactor ]
  workflow_dispatch:

env:
  ORACLE_HOST: 129.148.63.199
  ORACLE_USER: ubuntu
  DEPLOY_DIR: /opt/seo-analyzer

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      ALLOWED_HOSTS: ${{ secrets.AIO_ALLOWED_HOSTS }}
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json
        
    - name: Install frontend dependencies
      run: |
        cd frontend
        npm ci
        
    - name: Build frontend
      run: |
        cd frontend
        npm run build
        
    - name: Setup SSH key
      run: |
        mkdir -p ~/.ssh
        echo "${{ secrets.ORACLE_SSH_KEY }}" > ~/.ssh/oracle_key
        chmod 600 ~/.ssh/oracle_key
        ssh-keyscan -H $ORACLE_HOST >> ~/.ssh/known_hosts
        
    - name: Test SSH connection
      run: |
        ssh -i ~/.ssh/oracle_key -o ConnectTimeout=10 $ORACLE_USER@$ORACLE_HOST "echo 'SSH connection successful'"
        
    - name: Create deployment directory
      run: |
        ssh -i ~/.ssh/oracle_key $ORACLE_USER@$ORACLE_HOST "sudo mkdir -p $DEPLOY_DIR && sudo chown -R $ORACLE_USER:$ORACLE_USER $DEPLOY_DIR"
        
    - name: Copy files to server
      run: |
        ssh -i ~/.ssh/oracle_key $ORACLE_USER@$ORACLE_HOST "sudo rm -rf /tmp/deploy-staging && mkdir -p /tmp/deploy-staging"
        rsync -avz --delete -e "ssh -i ~/.ssh/oracle_key" --exclude 'node_modules' --exclude '.git' --exclude '__pycache__' --exclude '*.pyc' --exclude '.env' --exclude '.github' ./ $ORACLE_USER@$ORACLE_HOST:/tmp/deploy-staging/
        ssh -i ~/.ssh/oracle_key $ORACLE_USER@$ORACLE_HOST "sudo cp -r /tmp/deploy-staging/* $DEPLOY_DIR/ && sudo chown -R $ORACLE_USER:$ORACLE_USER $DEPLOY_DIR && rm -rf /tmp/deploy-staging"
          
    - name: Create environment file
      run: |
        ssh -i ~/.ssh/oracle_key $ORACLE_USER@$ORACLE_HOST 'cd '$DEPLOY_DIR' && cat > .env << "ENVEOF"
        DATABASE_URL=${{ secrets.DATABASE_URL }}
        REDIS_URL=redis://redis:6379/0
        ENVIRONMENT=production
        LOG_LEVEL=INFO
        SECRET_KEY=${{ secrets.SECRET_KEY }}
        ALLOWED_HOSTS=${{ secrets.AIO_ALLOWED_HOSTS }}
        OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}
        GOOGLE_API_KEY=${{ secrets.GOOGLE_API_KEY }}
        GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}
        PERPLEXITY_API_KEY=${{ secrets.PERPLEXITY_API_KEY }}
        SERPAPI_KEY=${{ secrets.SERPAPI_KEY }}
        PAGESPEED_API_KEY=${{ secrets.PAGESPEED_API_KEY }}
        CORS_ORIGINS=http://'$ORACLE_HOST',http://localhost:3000
        SECURE_COOKIES=false
        SESSION_TIMEOUT=3600
        MAX_WORKERS=4
        WORKER_TIMEOUT=300
        MAX_CONCURRENT_RUNS=5
        ENABLE_METRICS=true
        DB_CONNECT_TIMEOUT=60
        DB_COMMAND_TIMEOUT=120
        ENVEOF'
        
    - name: Validate deployment files and stop existing services
      run: |
        ssh -i ~/.ssh/oracle_key $ORACLE_USER@$ORACLE_HOST '
          cd '$DEPLOY_DIR'
          echo "=== Validating deployment files ==="
          if [ -f docker-compose.prod.yml ]; then
            echo "✅ docker-compose.prod.yml found"
            sudo docker compose -f docker-compose.prod.yml down || true
          else
            echo "❌ docker-compose.prod.yml not found!"
            ls -la
            exit 1
          fi
          
          if [ -d deploy ]; then
            echo "✅ deploy directory found"
          else
            echo "⚠️ deploy directory not found (not critical)"
          fi
          
          if [ -d frontend/dist ]; then
            echo "✅ frontend/dist found"
          else
            echo "❌ frontend/dist not found!"
            exit 1
          fi
        '

    - name: Clean old backups and prune Docker cache
      run: |
        ssh -i ~/.ssh/oracle_key $ORACLE_USER@$ORACLE_HOST '
          cd '$DEPLOY_DIR'
          
          echo "=== Cleaning old backups (keep last 5) ==="
          if [ -d backups ]; then
            ls -1dt backups/* 2>/dev/null | tail -n +6 | xargs -r rm -rf
            echo "✅ Old backups cleaned"
          fi
          
          echo "=== Pruning Docker builder cache ==="
          sudo docker builder prune -af || true
          
          echo "=== Pruning unused Docker images ==="
          sudo docker image prune -f --filter "until=72h" || true
          
          echo "=== Pruning dangling volumes ==="
          sudo docker volume prune -f || true
          
          echo "=== Pruning dangling build cache ==="
          sudo docker buildx prune -af --filter "until=72h" || true
          
          echo "=== Docker disk usage ==="
          sudo du -sh /var/lib/docker || true
        '

    - name: Sync repository on server
      run: |
        REPO=${{ github.repository }}
        REF=${{ github.ref_name }}
        ssh -i ~/.ssh/oracle_key $ORACLE_USER@$ORACLE_HOST "
          set -e
          DEPLOY_DIR='$DEPLOY_DIR'
          REPO='$REPO'
          REF='$REF'
          OWNER='$ORACLE_USER'
          if [ ! -d \"\$DEPLOY_DIR/.git\" ]; then
            sudo rm -rf \"\$DEPLOY_DIR\"
            sudo mkdir -p \"\$DEPLOY_DIR\"
            sudo chown -R \$OWNER:\$OWNER \"\$DEPLOY_DIR\"
            git clone https://github.com/\$REPO \"\$DEPLOY_DIR\"
          fi
          sudo chown -R \$OWNER:\$OWNER \"\$DEPLOY_DIR\"
          cd \"\$DEPLOY_DIR\"
          git fetch origin
          git checkout -f \$REF
          git reset --hard origin/\$REF
        "

    - name: Build and start services (including reverse-proxy)
      run: |
        ssh -i ~/.ssh/oracle_key $ORACLE_USER@$ORACLE_HOST '
          set -e
          export ALLOWED_HOSTS="${ALLOWED_HOSTS}"
          cd '$DEPLOY_DIR'
          echo "Building services..."
          docker compose -f docker-compose.prod.yml build --no-cache
          echo "Starting all services including reverse-proxy..."
          docker compose -f docker-compose.prod.yml up -d --remove-orphans
          echo "Verifying reverse-proxy is running..."
          docker compose -f docker-compose.prod.yml ps reverse-proxy
        '
        
    - name: Wait for services to start and validate reverse-proxy
      run: |
        echo "Waiting for services to stabilize..."
        sleep 30
        ssh -i ~/.ssh/oracle_key $ORACLE_USER@$ORACLE_HOST '
          cd '$DEPLOY_DIR'
          echo "=== Container Status ==="
          sudo docker compose -f docker-compose.prod.yml ps
          
          echo "=== Checking if reverse-proxy is running ==="
          if sudo docker compose -f docker-compose.prod.yml ps --status running reverse-proxy > /dev/null; then
            echo "✅ Reverse proxy is running"
          else
            echo "❌ Reverse proxy is not running!"
            sudo docker compose -f docker-compose.prod.yml logs reverse-proxy
            exit 1
          fi
          
          echo "=== Testing ports 80 and 443 ==="
          if command -v nc >/dev/null; then
            if nc -z 127.0.0.1 80; then
              echo "✅ Port 80 is open"
            else
              echo "❌ Port 80 is not responding"
            fi
            if nc -z 127.0.0.1 443; then
              echo "✅ Port 443 is open"
            else
              echo "❌ Port 443 is not responding"
            fi
          else
            echo "nc not available, skipping port check"
          fi
        '

    - name: Create keys payload (runner)
      run: |
        cat > keys.json <<JSON
        {
          "openai_key": "${{ secrets.OPENAI_API_KEY }}",
          "gemini_key": "${{ secrets.GEMINI_API_KEY != '' && secrets.GEMINI_API_KEY || secrets.GOOGLE_API_KEY }}",
          "perplexity_key": "${{ secrets.PERPLEXITY_API_KEY }}",
          "serpapi_key": "${{ secrets.SERPAPI_KEY }}"
        }
        JSON

    - name: Copy keys payload to server
      run: |
        scp -i ~/.ssh/oracle_key -o StrictHostKeyChecking=no keys.json $ORACLE_USER@$ORACLE_HOST:/tmp/keys.json

    - name: Persist API keys into engines (save-keys)
      run: |
        # Grava chaves via endpoint interno e injeta api_key nas engines Gemini sem api_key
        ssh -i ~/.ssh/oracle_key $ORACLE_USER@$ORACLE_HOST 'curl -sS -X POST http://localhost/api/setup/save-keys \
          -H "Content-Type: application/json" \
          --data @/tmp/keys.json || true'

    - name: Test connections (Gemini/OpenAI/Perplexity/SerpAPI)
      run: |
        ssh -i ~/.ssh/oracle_key $ORACLE_USER@$ORACLE_HOST 'curl -sS -X POST http://localhost/api/setup/test-connections \
          -H "Content-Type: application/json" \
          --data @/tmp/keys.json || true'

        
    - name: Debug container status and run migrations
      run: |
        sleep 60
        echo "Checking container status and logs..."
        ssh -i ~/.ssh/oracle_key $ORACLE_USER@$ORACLE_HOST 'cd '$DEPLOY_DIR' && 
        echo "=== Container Status ==="
        sudo docker compose -f docker-compose.prod.yml ps
        
        echo "=== API Container Logs (last 50 lines) ==="
        sudo docker compose -f docker-compose.prod.yml logs --tail=50 api
        
        echo "=== Checking if API container keeps restarting ==="
        for j in {1..5}; do
          STATUS=$(sudo docker compose -f docker-compose.prod.yml ps api --format "table {{.State}}" | tail -n +2)
          echo "API Status: $STATUS"
          if [[ "$STATUS" == "running" ]]; then
            echo "API container is stable, proceeding with migration"
            break
          else
            echo "API container not stable, waiting 15 seconds... ($j/5)"
            sleep 15
          fi
        done
        
        # Try migration only if container is stable
        if [[ "$STATUS" == "running" ]]; then
          echo "=== Running Database Migration ==="
          sudo docker compose -f docker-compose.prod.yml exec -T api python -c "import sys; from app.db.session import engine; from app.models.models import Base; Base.metadata.create_all(bind=engine); print(\"Database tables created successfully\")" || echo "Migration failed but continuing"
        else
          echo "⚠️ API container unstable, skipping migration"
        fi'
        
    - name: Verify deployment with retry
      run: |
        echo "Waiting for API to be ready..."
        for i in {1..6}; do
          echo "Health check attempt $i/6"
          # Try HTTPS first (preferred), then HTTP as fallback
          if curl -k -f -s https://$ORACLE_HOST/health > /dev/null; then
            echo "✅ Deployment successful - HTTPS Health check passed"
            exit 0
          elif curl -f -s http://$ORACLE_HOST/health > /dev/null; then
            echo "✅ Deployment successful - HTTP Health check passed"
            exit 0
          fi
          echo "Health check failed, waiting 15 seconds..."
          sleep 15
        done
        echo "❌ Health check failed after 6 attempts"
        echo "=== Checking reverse proxy logs ==="
        ssh -i ~/.ssh/oracle_key $ORACLE_USER@$ORACLE_HOST 'cd '$DEPLOY_DIR' && sudo docker compose -f docker-compose.prod.yml logs reverse-proxy --tail=20'
        echo "=== Checking API logs ==="
        ssh -i ~/.ssh/oracle_key $ORACLE_USER@$ORACLE_HOST 'cd '$DEPLOY_DIR' && sudo docker compose -f docker-compose.prod.yml logs api --tail=10'
        exit 1
        
    - name: Final cleanup (remove old Docker images and cache)
      if: always()
      run: |
        ssh -i ~/.ssh/oracle_key $ORACLE_USER@$ORACLE_HOST '
          echo "=== Final Docker cleanup ==="
          sudo docker system prune -f --filter "until=168h" || true
          echo "✅ Cleanup complete"
          echo "=== Current disk usage ==="
          sudo df -h /var/lib/docker 2>/dev/null || sudo du -sh /var/lib/docker || echo "Docker disk info unavailable"
        ' || true
        
    - name: Remove SSH key
      if: always()
      run: |
        rm -f ~/.ssh/oracle_key
